def obter_credenciais():
    # Procura o secrets.toml na raiz ou dentro da pasta .streamlit
    caminhos_possiveis = [
        "secrets.toml",
        ".streamlit/secrets.toml",
        os.path.join(os.path.dirname(__file__), "secrets.toml"),
        os.path.join(os.path.dirname(__file__), ".streamlit", "secrets.toml"),
    ]

    caminho_encontrado = None
    for c in caminhos_possiveis:
        if os.path.exists(c):
            caminho_encontrado = c
            break

    if not caminho_encontrado:
        raise FileNotFoundError(
            "Arquivo 'secrets.toml' não foi encontrado nem na raiz nem em"
            " '.streamlit/'!"
        )

    try:
        import tomllib

        with open(caminho_encontrado, "rb") as f:
            secrets = tomllib.load(f)
    except ImportError:
        import toml

        secrets = toml.load(caminho_encontrado)

    info = dict(secrets["gdrive"])
    if "folder_id" in info:
        info.pop("folder_id")
    if "token_uri" not in info:
        info["token_uri"] = "https://oauth2.googleapis.com/token"

    return service_account.Credentials.from_service_account_info(
        info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
    )
